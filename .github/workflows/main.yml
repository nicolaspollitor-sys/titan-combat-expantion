
name: Compilar Titanfall Ultimate Expansion

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Comprobar archivos
        run: |
          ls -la
          test -f build.gradle

      - name: Compilar JAR
        run: gradle build --stacktrace --no-daemon

      - name: Guardar JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Titanfall-Ultimate-Expansion-JAR
          path: build/libs/*.jar
          if-no-files-found: error
